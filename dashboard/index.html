<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Limiter Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚦 Distributed Rate Limiter</h1>
            <div class="header-info">
                <div class="info-item">
                    <span class="label">Window:</span>
                    <span class="value" id="window-time">60s</span>
                </div>
                <div class="info-item">
                    <span class="label">Max Requests:</span>
                    <span class="value" id="max-requests">10</span>
                </div>
                <div class="info-item">
                    <span class="label">Active Users:</span>
                    <span class="value" id="active-users">0</span>
                </div>
            </div>
        </header>

        <div class="control-panel">
            <h2>Request Tester</h2>
            <div class="control-form">
                <div class="form-group">
                    <label for="user-id-input">User ID</label>
                    <input type="text" id="user-id-input" placeholder="e.g., alice" value="alice">
                </div>
                <div class="form-group">
                    <label for="endpoint-select">Endpoint</label>
                    <select id="endpoint-select">
                        <option value="/ping">/ping</option>
                        <option value="/data">/data</option>
                    </select>
                </div>
                <div class="button-group">
                    <button id="send-one-btn" class="btn btn-primary">Send 1 Request</button>
                    <button id="send-five-btn" class="btn btn-secondary">Send 5 Requests</button>
                    <button id="send-fifteen-btn" class="btn btn-secondary">Send 15 Requests</button>
                </div>
            </div>
            <div id="request-feedback" class="feedback"></div>
        </div>

        <main id="users-container">
            <div class="empty-state">
                <p>No active users</p>
                <p class="hint">Send requests with X-User-ID header to see rate limiting in action</p>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
