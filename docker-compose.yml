version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: rate-limiter-redis
    networks:
      - rate-limiter-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rate-limiter-api
    ports:
      - "8000:8000"
    networks:
      - rate-limiter-net
    environment:
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_WINDOW=60
      - RATE_LIMIT_MAX=10
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: rate-limiter-dashboard
    ports:
      - "3000:80"
    networks:
      - rate-limiter-net
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

networks:
  rate-limiter-net:
    driver: bridge

volumes:
  redis-data:
